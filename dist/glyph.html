<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f4f1e8"><meta name="description" content="用偏旁造字，用汉字组词。让人、山水、花草与天气在自由画卷里相遇，创造自己的汉字世界。"><title>自由造物 · 字阵</title><link rel="icon" href="./icon-64.png?v=2" sizes="64x64" type="image/png"><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2" sizes="180x180"><link rel="stylesheet" href="./brand.css"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./creation.css"></head>
<body class="creation-body">
<header class="c-header"><a class="c-brand" href="./" aria-label="返回字阵首页"><img class="wordward-icon" src="./icon-192.png?v=2" width="44" height="44" alt="" decoding="async"><span>自由造物<small>偏旁成字 · 落字成景</small></span></a><div class="c-header-actions"><button id="creation-album" disabled>画册</button><button id="creation-book" disabled>造物册</button><button id="creation-help" aria-label="玩法说明" disabled>?</button></div></header>
<main class="c-layout">
 <section class="c-canvas-panel" aria-label="自由画卷"><div class="c-canvas-heading"><button id="creation-title" title="给画卷取个名字" disabled>我的一方天地 <small>✎</small></button><span id="creation-count">空白画卷</span></div><div class="c-world" id="creation-world" tabindex="0" aria-label="画卷正在准备"></div><div class="c-world-tip" id="creation-world-tip"><span id="creation-placement">从下面选偏旁，造出第一个字</span><button id="creation-cancel" hidden>取消落笔 ×</button></div><div class="c-world-toolbar"><div class="c-world-tools"><button id="creation-undo" disabled title="撤销上一次画卷变化">↶ <span>撤销</span></button><button id="creation-hand" class="active" disabled title="挪动造物">✥ <span>挪动</span></button><button id="creation-eraser" disabled title="移除造物">◇ <span>橡皮</span></button><button id="creation-labels" disabled title="显示造物的字词">字 <span>标记</span></button></div><button id="creation-export" disabled>导出画卷 ↗</button></div><div id="creation-selection" class="c-selection" hidden></div></section>
 <section class="c-workshop" aria-label="自由造物台"><div class="c-workshop-heading"><h1>造物台</h1><div class="c-mode-tabs"><button data-creation-mode="char" aria-pressed="true" disabled>偏旁 → 字</button><button data-creation-mode="word" aria-pressed="false" disabled>字 → 词</button></div><button id="creation-bag" disabled>字袋 ↗</button></div>
  <div id="creation-layouts" class="c-structures" aria-label="组字结构"></div>
  <div class="c-forging"><div><div id="creation-slots" class="c-slots" data-layout="single" aria-label="组字格"></div><button id="creation-clear" disabled>重摆</button></div><div id="creation-preview" class="c-preview"><b class="c-empty-preview">让想象<br>长出来</b><small>自由搭一搭，不扣分</small></div></div>
  <div class="c-parts-heading"><span id="creation-parts-title">灵感部件</span><button id="creation-refresh" disabled>↻ 换些灵感</button><button id="creation-parts-more" disabled>全部部件 ↗</button></div><div id="creation-parts" class="c-parts" aria-label="可重复使用的候选部件"></div>
  <p id="creation-feedback" class="c-feedback" role="status">部件可以重复用，没有关卡顺序，想造什么都可以。</p><div class="c-forge-footer"><button id="creation-inspire" class="c-secondary" disabled>找点灵感</button><button id="creation-forge" class="c-primary" disabled>选部件，造一个字 →</button></div>
 </section>
</main>
<footer class="c-footer"><span id="creation-save-status">画卷保存在当前浏览器</span><span id="creation-discoveries">等待第一次相遇</span></footer>
<dialog id="creation-dialog" class="c-dialog"><button id="creation-dialog-close" class="c-close" aria-label="关闭">×</button><div id="creation-dialog-content"></div></dialog><div id="creation-live" class="c-sr" aria-live="polite"></div>
<script type="module" src="./creation-app.mjs"></script></body></html>
